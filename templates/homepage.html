<!DOCTYPE html>
<html>
<head>
    <title>LinkCraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='assets/lc_logo.webp') }}">
</head>
<body>
    <video autoplay muted loop id="bg-video">
    <source src="{{ url_for('static', filename='assets/bg.webm') }}" type="video/webm">
    <source src="{{ url_for('static', filename='assets/bg.mp4') }}" type="video/mp4">
    </video>

    <div class="social-links">
        <a href="https://www.linkedin.com/in/aryan-raj-6833a2258/" target="_blank"><img src="{{ url_for('static', filename='assets/linkedin-icon.svg') }}" width="18"></a>
        <a href="https://github.com/Aryan130103" target="_blank"><img src="{{ url_for('static', filename='assets/github-icon.svg') }}" width="18"></a>
        <a href="https://leetcode.com/u/SleepyCoder01/" target="_blank"><img src="{{ url_for('static', filename='assets/leetcode-icon.svg') }}" width="16"></a>
        <a href="mailto:a.raj130103@gmail.com"><img src="{{ url_for('static', filename='assets/email-icon.svg') }}" width="18"></a>
    </div>

    <div class="header">
        <picture>
        <source srcset="{{ url_for('static', filename='assets/lc_logo.webp') }}" type="image/webp">
        <img src="{{ url_for('static', filename='assets/lc_logo.png') }}" alt="LinkCraft logo" class="logo">
        </picture>
        <h1>Link<span class="accent">Craft</span></h1>
        <div class="developer-info">
            <p class="tagline">Developer - <span class="name">Aryan Raj</span></p>
        </div>
    </div>

    <div class="card">
        <form id="shorten-form">
            <div class="input-group url-input">
                <input type="text" name="url" id="url-field" placeholder="Paste your url here..." required autocomplete="off">
                <button type="button" id="paste-btn">
                    <img src="{{ url_for('static', filename='assets/paste-icon.svg') }}" alt="Paste" width="14">
                    Paste
                </button>
            </div>

            <p class="section-label">Optional Features:</p>

            <div class="input-group hidden" id="field-custom_alias">
                <input type="text" name="custom_alias" placeholder="Custom alias" autocomplete="off">
            </div>
            <div class="input-group hidden" id="field-title">
                <input type="text" name="title" placeholder="Title" autocomplete="off">
            </div>
            <div class="input-group hidden" id="field-description">
                <input type="text" name="description" placeholder="Description" autocomplete="off">
            </div>
            <div class="input-group hidden" id="field-image_url">
                <input type="text" name="image_url" placeholder="Thumbnail URL" autocomplete="off">
            </div>

            <div class="toggle-row">
                <button type="button" class="toggle-btn" data-target="custom_alias">
                    <img src="{{ url_for('static', filename='assets/alias-icon.svg') }}" width="18" class="btn-icon">
                    <span class="btn-text">
                        <span class="btn-title">Custom Alias</span>
                        <span class="btn-subtitle">Add a custom alias to your link</span>
                    </span>
                    <span class="arrow">›</span>
                </button>
                <button type="button" class="toggle-btn" data-target="title">
                    <img src="{{ url_for('static', filename='assets/title-icon.svg') }}" width="16" class="btn-icon">
                    <span class="btn-text">
                        <span class="btn-title">Title</span>
                        <span class="btn-subtitle">Add a title for your link</span>
                    </span>
                    <span class="arrow">›</span>
                </button>
                <button type="button" class="toggle-btn" data-target="description">
                    <img src="{{ url_for('static', filename='assets/description-icon.svg') }}" width="18" class="btn-icon">
                    <span class="btn-text">
                        <span class="btn-title">Description</span>
                        <span class="btn-subtitle">Add a description to your link</span>
                    </span>
                    <span class="arrow">›</span>
                </button>
                <button type="button" class="toggle-btn" data-target="image_url">
                    <img src="{{ url_for('static', filename='assets/thumbnail-icon.svg') }}" width="16" class="btn-icon">
                    <span class="btn-text">
                        <span class="btn-title">Thumbnail URL</span>
                        <span class="btn-subtitle">Add a custom thumbnail</span>
                    </span>
                    <span class="arrow">›</span>
                </button>
            </div>

            <div class="submit-row">
                <button type="submit" id="shorten-btn">
                    <img src="{{ url_for('static', filename='assets/stars-icon.svg') }}" width="16" alt="">
                    Shorten Link
                </button>
            </div>
        </form>

        <div id="result-container" style="display: none;">
            <span id="result-link"></span>
            <button id="copy-btn">
                <img src="{{ url_for('static', filename='assets/copy-icon.svg') }}" alt="Copy" width="16">
            </button>
        </div>
    </div>

    <div id="stats-bar">
        <div class="stat-item">
            <span id="links-count">0</span>
            <span class="stat-label">Links Created</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span id="avg-response">0ms</span>
            <span class="stat-label">API Response Time</span>
        </div>
    </div>

    <footer>
        <p>© 2026 <span class="brand">LinkCraft</span>. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
